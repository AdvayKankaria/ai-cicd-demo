version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U user -d orders
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
    - 8001:8000
    environment:
    - APP_ENV=local
    - APP_VERSION=1.0.0
    - DATABASE_URL=postgresql://user:password@postgres:5432/orders
    - REDIS_URL=redis://redis:6379/0
    - SIMULATE_FAILURE=${SIMULATE_FAILURE:-false}
    - FAILURE_SCENARIO=${FAILURE_SCENARIO:-none}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
