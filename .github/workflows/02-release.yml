name: Production Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      failure_scenario:
        description: 'Simulate a failure scenario'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - test_failure
          - sonarqube_failure
          - fortify_failure
          - sonatype_failure
          - build_failure
          - security_failure
          - sysdig_failure
          - migration_failure
          - deployment_failure
          - uat_failure
          - prod_canary_failure
          - post_production_failure
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Inject test failure
        if: ${{ inputs.failure_scenario == 'test_failure' }}
        run: |
           echo "SIMULATE_FAILURE=true" >> $GITHUB_ENV
           echo "FAILURE_SCENARIO=test_failure" >> $GITHUB_ENV
      - name: Run tests
        run: pytest tests/unit --cov=services --cov-report=xml
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"

  build:
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inject build failure
        if: ${{ inputs.failure_scenario == 'build_failure' }}
        run: exit 1
      - name: Docker Build Config
        run: docker compose config
      - name: Docker Build
        run: docker compose build

  sonarqube:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject SonarQube failure
        if: ${{ inputs.failure_scenario == 'sonarqube_failure' || github.event.inputs.failure_scenario == 'sonarqube_failure' }}
        run: |
          echo "FAILURE_STAGE=SONARQUBE"
          echo "FAILURE_CLASS=CODE_QUALITY"
          echo "FAILURE_REASON=SONARQUBE_POLICY_FAILURE"
          exit 1
      - name: Check Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "MODE: REAL"
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "TOOL: SonarQube"
            echo "MODE: DEMO"
            echo "Credentials missing. Simulating SonarQube stage completion."
          fi
      - name: SonarQube Scan Official
        if: ${{ steps.check_creds.outputs.has_creds == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  fortify:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Fortify failure
        if: ${{ inputs.failure_scenario == 'fortify_failure' || github.event.inputs.failure_scenario == 'fortify_failure' }}
        run: |
          echo "FAILURE_STAGE=FORTIFY"
          echo "FAILURE_CLASS=SAST"
          echo "FAILURE_REASON=FORTIFY_POLICY_FAILURE"
          exit 1
      - name: Check Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.FORTIFY_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "MODE: REAL"
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "TOOL: Fortify"
            echo "MODE: DEMO"
          fi
      - name: Fortify Scan Official
        if: ${{ steps.check_creds.outputs.has_creds == 'true' }}
        uses: fortify/github-action@v1
        with:
          sast-scan: true

  sonatype:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Sonatype failure
        if: ${{ inputs.failure_scenario == 'sonatype_failure' || github.event.inputs.failure_scenario == 'sonatype_failure' }}
        run: |
          echo "FAILURE_STAGE=SONATYPE"
          echo "FAILURE_CLASS=DEPENDENCY_SECURITY"
          echo "FAILURE_REASON=SONATYPE_POLICY_FAILURE"
          exit 1
      - name: Check Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.SONATYPE_USERNAME }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "MODE: REAL"
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "TOOL: Sonatype Lifecycle"
            echo "MODE: DEMO"
          fi
      - name: Sonatype Lifecycle Scan
        if: ${{ steps.check_creds.outputs.has_creds == 'true' }}
        uses: sonatype/nexus-iq-github-action@v1
        with:
          serverUrl: ${{ secrets.SONATYPE_IQ_SERVER_URL }}
          username: ${{ secrets.SONATYPE_USERNAME }}
          password: ${{ secrets.SONATYPE_PASSWORD }}
          applicationId: ${{ secrets.SONATYPE_APPLICATION_ID }}
          stage: build
          target: requirements.txt

  security:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Bandit Security Scan
        run: bandit -r services/
      - name: Pip Audit
        run: pip-audit -r requirements.txt

  codeql:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  publish:
    needs: [sonarqube, fortify, sonatype, security, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Build and Push API
        uses: docker/build-push-action@v5
        id: push
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ghcr.io/advaykankaria/ai-cicd-demo/ai-cicd-demo-api:${{ github.sha }}
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/advaykankaria/ai-cicd-demo/ai-cicd-demo-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  trivy:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Inject security failure
        if: ${{ inputs.failure_scenario == 'security_failure' }}
        run: exit 1
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/advaykankaria/ai-cicd-demo/ai-cicd-demo-api@${{ needs.publish.outputs.image_digest }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sysdig:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Inject Sysdig failure
        if: ${{ inputs.failure_scenario == 'sysdig_failure' || github.event.inputs.failure_scenario == 'sysdig_failure' }}
        run: |
          echo "FAILURE_STAGE=SYSDIG"
          echo "FAILURE_CLASS=CONTAINER_SECURITY"
          echo "FAILURE_REASON=SYSDIG_POLICY_FAILURE"
          exit 1
      - name: Check Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.SYSDIG_SECURE_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "MODE: REAL"
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "TOOL: Sysdig Secure"
            echo "MODE: DEMO"
          fi
      - name: Sysdig Secure Inline Scan
        if: ${{ steps.check_creds.outputs.has_creds == 'true' }}
        uses: sysdiglabs/scan-action@v4
        with:
          image-tag: ghcr.io/advaykankaria/ai-cicd-demo/ai-cicd-demo-api@${{ needs.publish.outputs.image_digest }}
          sysdig-secure-token: ${{ secrets.SYSDIG_SECURE_TOKEN }}
          sysdig-secure-url: ${{ secrets.SYSDIG_SECURE_URL }}

  enterprise-security-gate:
    needs: [sonarqube, fortify, sonatype, trivy, sysdig, codeql, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Dependencies
        run: |
          echo "### Enterprise Security Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Purpose | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SonarQube | Code Quality | ${{ needs.sonarqube.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fortify | SAST | ${{ needs.fortify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sonatype | Dependency Security | ${{ needs.sonatype.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | Container CVE | ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sysdig | Container Security | ${{ needs.sysdig.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | SAST | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | Python Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit | Dependency Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "### Overall Enterprise Security Gate: FAIL" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "### Overall Enterprise Security Gate: PASS" >> $GITHUB_STEP_SUMMARY
          fi

  dev-deployment:
    needs: [enterprise-security-gate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject deployment failure
        if: ${{ inputs.failure_scenario == 'deployment_failure' }}
        run: exit 1
      - name: Deploy DEV
        run: |
          echo "Deploying artifact ghcr.io/advaykankaria/ai-cicd-demo/ai-cicd-demo-api@${{ needs.publish.outputs.image_digest }}"
          docker compose up -d
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: DEV Health Check
        run: python scripts/health_check.py
      - name: DEV Smoke Tests
        run: echo "Running DEV smoke tests..."

  uat-deployment:
    needs: [dev-deployment, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy UAT
        run: |
          echo "Deploying artifact ghcr.io/advaykankaria/ai-cicd-demo/ai-cicd-demo-api@${{ needs.publish.outputs.image_digest }}"
          docker compose up -d
      - name: Inject migration failure
        if: ${{ inputs.failure_scenario == 'migration_failure' }}
        run: exit 1
      - name: UAT Migrations
        run: echo "Running Alembic migrations on UAT..."
      - name: Inject UAT test failure
        if: ${{ inputs.failure_scenario == 'uat_failure' }}
        run: exit 1
      - name: UAT Tests
        run: echo "Running UAT Tests..."
      - name: Release Gate
        run: echo "UAT validated. Awaiting Prod Approval."

  prod-approval:
    needs: [uat-deployment]
    runs-on: ubuntu-latest
    environment:
      name: PROD-APPROVAL
    steps:
      - run: echo "Approved for production"

  prod-canary:
    needs: [prod-approval, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Canary
        run: echo "Deploying canary ghcr.io/advaykankaria/ai-cicd-demo/ai-cicd-demo-api@${{ needs.publish.outputs.image_digest }}"
      - name: Check canary failure
        if: ${{ inputs.failure_scenario == 'prod_canary_failure' }}
        run: exit 1
      - run: echo "Canary passed"

  prod-promotion:
    needs: [prod-canary, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote to Production
        run: echo "Promoting artifact ghcr.io/advaykankaria/ai-cicd-demo/ai-cicd-demo-api@${{ needs.publish.outputs.image_digest }} to 100%"

  post-production:
    needs: [prod-promotion]
    runs-on: ubuntu-latest
    steps:
      - name: Check post-prod failure
        if: ${{ inputs.failure_scenario == 'post_production_failure' }}
        run: exit 1
      - run: echo "Post production tests passed"

  release-summary:
    needs: [post-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### AI CI/CD Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "Application: Order Management Platform" >> $GITHUB_STEP_SUMMARY
          echo "Release: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "CI: PASS" >> $GITHUB_STEP_SUMMARY
